# Builds a PR preview of akash-network/website and uploads the static output
# as a GitHub Actions artifact. Broadway downloads the artifact and serves
# the files directly from its own disk — no Docker image or Akash container
# per PR is needed any more.
#
# Triggered on demand by Broadway via workflow_dispatch.

name: Build PR preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "akash-network/website PR number to build"
        required: true
        type: string

permissions:
  contents: read
  actions: write   # needed to upload artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream PR code
        run: |
          mkdir site && cd site
          git init -q
          git remote add origin https://github.com/akash-network/website.git
          git fetch -q --depth 1 origin "pull/${{ inputs.pr }}/head"
          git checkout -q FETCH_HEAD

      - name: Build Astro site
        run: cd site && npm ci && npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          # Name includes run_id so Broadway can find it unambiguously.
          name: preview-${{ inputs.pr }}-${{ github.run_id }}
          path: site/dist/
          retention-days: 7
          if-no-files-found: error
