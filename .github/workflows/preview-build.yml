# Builds a PR preview image for the upstream akash-network/website repo and
# pushes it to ghcr.io/<owner>/website-preview:pr-<N>. Triggered on demand by
# Broadway via the GitHub API (workflow_dispatch). Uses plain shell, no
# marketplace actions.

name: Build PR preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "akash-network/website PR number to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get builder files (Dockerfile, nginx.conf)
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git builder

      - name: Fetch upstream PR code
        run: |
          mkdir site && cd site
          git init -q
          git remote add origin https://github.com/akash-network/website.git
          git fetch -q --depth 1 origin "pull/${{ inputs.pr }}/head"
          git checkout -q FETCH_HEAD
          cd ..
          cp builder/.preview/Dockerfile builder/.preview/nginx.conf site/

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push preview image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/website-preview"
          docker build -t "$IMAGE:pr-${{ inputs.pr }}" site
          docker push "$IMAGE:pr-${{ inputs.pr }}"
          echo "Pushed $IMAGE:pr-${{ inputs.pr }}"
