server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits directory-style routes (/page/index.html). Fall back to
    # .html, then the generated 404 page, then a hard 404.
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }
}
