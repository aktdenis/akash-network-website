server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro emits directory-style routes (/page/index.html).
    # Explicit $uri/index.html lookup avoids relying on nginx directory-index
    # resolution, which can behave inconsistently across provider environments.
    location / {
        try_files $uri $uri/index.html $uri.html /404.html =404;
    }

    # Never cache HTML pages.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    # Cache content-hashed assets forever.
    location ~* \.(js|css|svg|woff2?|ico|png|jpg|jpeg|webp|avif|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
